# Copy this file to .streamlit/secrets.toml for local development.
# Never commit the real secrets.toml file.

OPENAI_API_KEY = ""
OPENAI_MODEL = "gpt-5-mini"
AI_TIMEOUT_SECONDS = 10.0
# Master switch for the three OpenAI calls (consistency check, payment
# reference, document extraction). Off: labeled local fallback, no network.
AI_LLM_CALLS_ENABLED = false
# Send document images to OpenAI vision. Off by default: an image cannot be
# redacted, so the whole document would leave the system verbatim.
AI_SEND_DOCUMENT_IMAGES = false
