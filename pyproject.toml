[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-approval-mvp"
version = "0.1.0"
description = "Role-based expense approval MVP built with Streamlit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "streamlit==1.63.0",
  "SQLAlchemy==2.0.45",
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "openai==2.14.0",
  "pydantic==2.12.5",
  "pypdf==6.18.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
